<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0d1117"/>
      <rect width="7" height="7" fill="#161b22"/>
    </pattern>
    <style>
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      .cursor { animation: blink 0.7s step-end infinite; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="600" height="180" fill="url(#grid)"/>

  <!-- Pixel decorations -->
  <rect x="40" y="20" width="8" height="8" fill="#6366f1" opacity="0.6"/>
  <rect x="48" y="12" width="8" height="8" fill="#818cf8" opacity="0.4"/>
  <rect x="56" y="20" width="8" height="8" fill="#6366f1" opacity="0.6"/>
  <rect x="520" y="40" width="8" height="8" fill="#6366f1" opacity="0.3"/>
  <rect x="528" y="32" width="8" height="8" fill="#818cf8" opacity="0.5"/>
  <rect x="536" y="40" width="8" height="8" fill="#6366f1" opacity="0.3"/>
  <rect x="544" y="48" width="8" height="8" fill="#818cf8" opacity="0.2"/>
  <rect x="30" y="140" width="8" height="8" fill="#6366f1" opacity="0.3"/>
  <rect x="38" y="148" width="8" height="8" fill="#818cf8" opacity="0.2"/>
  <rect x="560" y="130" width="8" height="8" fill="#6366f1" opacity="0.3"/>

  <!-- Name -->
  <text x="300" y="82" font-family="monospace" font-size="56" font-weight="700" fill="#6366f1" text-anchor="middle" letter-spacing="6">ZACH</text>

  <!-- Subtitle -->
  <text x="300" y="118" font-family="monospace" font-size="14" fill="#475569" text-anchor="middle" letter-spacing="3">PM → AI WORKFLOW BUILDER</text>

  <!-- Blinking cursor after subtitle -->
  <text x="428" y="118" font-family="monospace" font-size="14" fill="#6366f1" class="cursor">_</text>

  <!-- Bottom pixel line -->
  <rect x="120" y="160" width="360" height="2" fill="#6366f1" opacity="0.3"/>
</svg>
