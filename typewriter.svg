<svg xmlns="http://www.w3.org/2000/svg" width="640" height="80" viewBox="0 0 640 80">
  <defs>
    <style>
      @keyframes fade1 { 0%,18% { opacity:1 } 22%,100% { opacity:0 } }
      @keyframes fade2 { 0%,18% { opacity:0 } 22%,43% { opacity:1 } 47%,100% { opacity:0 } }
      @keyframes fade3 { 0%,43% { opacity:0 } 47%,68% { opacity:1 } 72%,100% { opacity:0 } }
      @keyframes fade4 { 0%,68% { opacity:0 } 72%,94% { opacity:1 } 98%,100% { opacity:0 } }
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      .l1 { animation: fade1 10s infinite }
      .l2 { animation: fade2 10s infinite }
      .l3 { animation: fade3 10s infinite }
      .l4 { animation: fade4 10s infinite }
      .cursor { animation: blink 0.7s infinite }
    </style>
  </defs>
  <text x="0" y="48" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#0f172a">
    <tspan class="l1">将业务 SOP 拆解后用 AI 重构落地</tspan>
    <tspan class="l2">从 0 搭建全栈 PM 决策面板</tspan>
    <tspan class="l3">三 Agent 并行管线替代单次 LLM 调用</tspan>
    <tspan class="l4">不研究模型，聚焦 AI 能力边界与业务结合点</tspan>
    <tspan class="cursor" fill="#6366f1">_</tspan>
  </text>
</svg>
